# Free-tier backend on Render, as an alternative to Vercel's Python runtime.
#
# The trade-off: Render's free web service sleeps after 15 minutes idle and takes
# roughly a minute to wake, so the first visitor after a quiet spell waits. Vercel's
# serverless cold start is a couple of seconds. Render's free tier does permit
# commercial use, which Vercel's Hobby plan does not — so the right choice depends
# on whether this stays a personal project.
services:
  - type: web
    name: property-decision-engine-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/health
    envVars:
      - key: PDE_ENVIRONMENT
        value: production
      # Set to the deployed frontend origin, or the browser preflight fails and
      # every request dies before it is made.
      - key: PDE_CORS_ORIGINS
        sync: false
      - key: PDE_ORS_API_KEY
        sync: false
      # No model and no OpenStreetMap services in a free deployment: both
      # degrade to a stated reason rather than an error.
      - key: PDE_LLM_BASE_URL
        value: ""
      - key: PDE_NOMINATIM_URL
        value: ""
      - key: PDE_ROUTING_URL
        value: ""
      - key: PDE_OVERPASS_URL
        value: ""
