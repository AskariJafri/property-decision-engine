[project]
name = "property-decision-engine"
version = "0.1.0"
description = "AI property decision engine for Ontario home buyers"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14",
    "asyncpg>=0.30",
    "psycopg[binary]>=3.2",
    "geoalchemy2>=0.15",
    "httpx>=0.28",
    "argon2-cffi>=23.1",
    "python-multipart>=0.0.12",
    "pypdf>=5.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "aiosqlite>=0.20",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Migration bodies are generated by alembic and edited only where the diff needs
# a human decision. Reformatting them on every autogenerate would make review
# noise out of the one artefact that most needs to be read literally.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
# RUF001/RUF002: en dashes and multiplication signs are correct here — the official
# licence name is "Open Government Licence – Toronto" and mangling it would be wrong.
ignore = ["RUF001", "RUF002"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
