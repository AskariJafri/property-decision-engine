name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    timeout-minutes: 10
    name: Backend — lint, types, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Types (mypy)
        run: mypy app

      # The unit suite is pure: engines take value objects and return value objects,
      # so nothing here needs Postgres or a network. That is the property
      # tests/unit/test_layering.py exists to keep true. The schema-constraint tests
      # skip without PDE_TEST_DATABASE_URL and run in the migrations job below.
      - name: Test (pytest)
        run: pytest -q

  migrations:
    timeout-minutes: 10
    name: Migrations apply, round-trip, and hold their constraints
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: pde
          POSTGRES_PASSWORD: pde
          POSTGRES_DB: pde
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pde"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PDE_DATABASE_URL: postgresql+asyncpg://pde:pde@localhost:5432/pde
      PDE_TEST_DATABASE_URL: postgresql://pde:pde@localhost:5432/pde

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Migrate to head
        run: alembic upgrade head

      # A migration that cannot be undone is a migration nobody dares run. The
      # round trip also catches the classic Postgres trap where dropping a table
      # leaves its ENUM behind and the next upgrade fails on "type already exists".
      - name: Downgrade and re-upgrade
        run: |
          alembic downgrade base
          alembic upgrade head

      # Models and migrations must agree. A drift here means someone edited a model
      # without generating the migration, and the next deploy would be a surprise.
      - name: No pending schema drift
        run: alembic check

      - name: Schema constraints hold (pytest)
        run: pytest tests/integration -q

  frontend:
    timeout-minutes: 15
    name: Frontend — types, build, E2E
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: npm ci
        working-directory: web

      - run: npx tsc --noEmit
        working-directory: web

      - run: npx next build
        working-directory: web

      - run: pip install -e ".[dev]"
        working-directory: backend

      # The E2E suite exists because of what it caught: the API had no CORS
      # middleware, so every browser request died at the preflight while every
      # server-side test passed. It runs against both servers, for real.
      # Redirecting stdout and stderr is load-bearing, not tidiness. A
      # backgrounded process that still holds the step's pipes keeps the step
      # alive after its command has finished: wait-on returned in seconds and the
      # job then sat for half an hour until it was cancelled by hand.
      - name: Start API and web
        run: |
          echo "uvicorn: $(command -v uvicorn || echo 'NOT ON PATH')"
          (cd backend && nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/api.log 2>&1 &)
          (cd web && nohup npx next start -p 3000 > /tmp/web.log 2>&1 &)
          sleep 8
          # Printed before wait-on, not after: if the API died on startup its
          # traceback is the answer, and waiting ninety seconds to find that out
          # costs a whole run.
          echo "--- api.log ---"; cat /tmp/api.log || true
          echo "--- web.log ---"; cat /tmp/web.log || true
          npx --yes wait-on -t 90000 http://127.0.0.1:8000/api/v1/health http://127.0.0.1:3000

      - name: Server logs on failure
        if: failure()
        # -n 50, not -50: GNU tail rejects the obsolete form with several files,
        # so the diagnostic step was itself failing and printing nothing.
        run: tail -n 50 /tmp/api.log /tmp/web.log || true

      - run: npx playwright install --with-deps chromium
        working-directory: web

      - run: npx playwright test
        working-directory: web
